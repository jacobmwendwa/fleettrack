<!DOCTYPE html>
<html>
<head>

    <title>Edit Profile</title>

    {% load static %}

    <link rel="stylesheet"
          href="{% static 'accounts/style.css' %}">

</head>

<body>

<div class="main-content">

    <div class="dashboard-content">

        <div class="page-header">

            <div>
                <h1>Edit Profile</h1>

                <p>
                    Update your account information.
                </p>
            </div>

        </div>

        <div class="form-container">

            <form method="post">

                {% csrf_token %}

                <div class="form-group">

                    <label for="first_name">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="first_name"
                        name="first_name"
                        value="{{ user.first_name }}"
                        placeholder="First name"
                    >

                </div>

                <div class="form-group">

                    <label for="last_name">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="last_name"
                        name="last_name"
                        value="{{ user.last_name }}"
                        placeholder="Last name"
                    >

                </div>

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ user.email }}"
                        placeholder="Email address"
                    >

                </div>

                <button
                    type="submit"
                    class="add-vehicle-button">
                    Save Changes
                </button>

                <a
                    href="{% url 'profile' %}"
                    class="edit-button">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
