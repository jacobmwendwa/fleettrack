<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - FleetTrack</title>
</head>

<body>

<h2>Forgot Password?</h2>

<p>
    Enter the email address associated with your FleetTrack account.
</p>

<form method="post">
    {% csrf_token %}

    {{ form.email.errors }}

    {{ form.email.label_tag }}
    {{ form.email }}

    <button type="submit">
        Send Reset Link
    </button>
</form>

<p>
    <a href="{% url 'login' %}">Back to Login</a>
</p>

</body>
</html>
