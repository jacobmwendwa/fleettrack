<!DOCTYPE html>
<html>
<head>

    <title>Delete Alert</title>

    {% load static %}

    <link rel="stylesheet"
          href="{% static 'accounts/style.css' %}">

</head>

<body>

<div class="main-content">

    <div class="dashboard-content">

        <div class="page-header">

            <div>
                <h1>Delete Alert</h1>

                <p>
                    Confirm that you want to delete this alert.
                </p>
            </div>

        </div>

        <div class="form-container">

            <p>
                <strong>Vehicle:</strong>
                {{ alert.vehicle.registration_number }}
            </p>

            <p>
                <strong>Alert Type:</strong>
                {{ alert.get_alert_type_display }}
            </p>

            <p>
                <strong>Message:</strong>
                {{ alert.message }}
            </p>

            <p>
                Are you sure you want to delete this alert?
            </p>

            <form method="post">

                {% csrf_token %}

                <button type="submit"
                        class="delete-button">
                    Delete Alert
                </button>

                <a href="{% url 'alerts' %}"
                   class="edit-button">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
