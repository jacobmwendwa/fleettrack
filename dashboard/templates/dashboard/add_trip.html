<!DOCTYPE html>
<html>

<head>

    <title>Add Trip</title>

    {% load static %}

    <link rel="stylesheet"
          href="{% static 'accounts/style.css' %}">

</head>

<body>

<div class="main-content">

    <div class="dashboard-content">

        <div class="page-header">

            <div>

                <h1>Add Trip</h1>

                <p>
                    Add a new vehicle trip.
                </p>

            </div>

        </div>

        <div class="form-container">

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button
                    type="submit"
                    class="add-vehicle-button">
                    Save Trip
                </button>

                <a
                    href="{% url 'trips' %}"
                    class="edit-button">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
